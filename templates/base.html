<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}作业效率助手{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="{{ url_for('dashboard') }}">📚 作业效率助手</a>
    {% if g.user %}
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('new_project') }}">创建项目</a>
      <a href="{{ url_for('submitted') }}">已提交</a>
      <span class="spacer"></span>
      <span class="muted">{{ g.user.username }}</span>
      <form method="POST" action="{{ url_for('logout') }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <button class="btn secondary small" type="submit">登出</button>
      </form>
    {% endif %}
  </nav>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
