<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>登录 - 作业效率助手</title>
</head>
<body>
    <h1>登录</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <p>用户名：<input type="text" name="username" required></p>
        <p>密码：<input type="password" name="password" required></p>
        <button type="submit">登录</button>
    </form>

    <p>还没有账号？<a href="{{ url_for('register') }}">去注册</a></p>
</body>
</html>
