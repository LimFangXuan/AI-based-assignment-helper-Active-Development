<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>注册 - 作业效率助手</title>
</head>
<body>
    <h1>注册</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <p>用户名：<input type="text" name="username" required></p>
        <p>密码：<input type="password" name="password" required></p>
        <button type="submit">注册</button>
    </form>
</body>
</html>
