{% extends "base.html" %}
{% block title %}注册 - 作业效率助手{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h1>注册</h1>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label for="username">用户名（3-80 个字符）</label>
    <input type="text" id="username" name="username" value="{{ username or '' }}" required>
    <label for="password">密码（至少 6 个字符）</label>
    <input type="password" id="password" name="password" required>
    <p><button class="btn" type="submit">注册</button></p>
  </form>
  <p class="muted">已有账号？<a href="{{ url_for('login') }}">去登录</a></p>
</div>
{% endblock %}
